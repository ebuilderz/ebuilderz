<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Naman Modi — AI, web and business systems</title>
  <desc id="desc">Founder of eBuilderz. Strategy, design and team delivery. A charcoal banner with lime and lavender accents and a connected systems diagram.</desc>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#24272b"/>
      <stop offset="1" stop-color="#171a1e"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="560" rx="28" fill="#17191c"/>
  <rect width="1600" height="560" rx="28" fill="url(#grid)"/>
  <path d="M28 0H1572Q1600 0 1600 28V7H0V28Q0 0 28 0" fill="#d4f77d"/>
